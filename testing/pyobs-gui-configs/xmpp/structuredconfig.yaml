# XMPP-adapted from https://github.com/pyobs/pyobs-gui/blob/master/test/structuredconfig.yaml —
# see specs/steering/testing-against-live-backend.md for the transformation.
# Requires an ejabberd account "config" on domain "localhost". Run with:
#   <pyobs-venv>/bin/pyobs testing/pyobs-gui-configs/xmpp/structuredconfig.yaml
#
# Needs a current pyobs-core, see specs/steering/open-items.md's fixture-staleness note.
class: pyobs.modules.MultiModule

modules:
  config:
    class: pyobs.modules.utils.dummystructuredconfig.DummyStructuredConfig
    label: config
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: config
      password: pyobs
