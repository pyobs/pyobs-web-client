# XMPP-adapted from https://github.com/pyobs/pyobs-gui/blob/master/test/telescope_acl_denied.yaml — see
# specs/steering/testing-against-live-backend.md for the transformation.
#
# ACL note: see telescope_acl.yaml's comment — the "admin" key must match the
# localpart of whatever JID you log into the web client with.
#
# Expected result (per specs/plans/2026-08-03-acl-aware-shell-forms.md's actual, later-decided
# "grey out, not hide" design — an earlier version of this comment said the module should
# vanish from the sidebar/module list entirely, which is stale, not this design):
# the module still shows up (Dashboard, module page) exactly as normal — Init/Park/Stop and every
# RA/Dec/Alt/Az/Tracking control render disabled, not absent.
#
# Requires an ejabberd account "telescope" on domain "localhost". Run with:
#   <pyobs-venv>/bin/pyobs testing/pyobs-gui-configs/xmpp/telescope_acl_denied.yaml
#
# Needs a current pyobs-core: this repo's pinned testing/.venv (2.0.0.dev53) predates
# Module.__init__'s name -> label rename below; use an editable install of ../pyobs-core
# instead (uv pip install --python testing/.venv -e ../pyobs-core[full]) until the pin is
# bumped — see specs/plans/2026-08-04-vfs-token-auth.md's "Remaining action" note.
class: pyobs.modules.MultiModule

location:
  longitude: 9.944722
  latitude: 51.560583
  elevation: 201

modules:
  telescope:
    class: pyobs.modules.telescope.DummyAltAzTelescope
    label: telescope
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: telescope
      password: pyobs
    acl:
      allow:
        admin: []
