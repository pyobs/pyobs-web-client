# XMPP-adapted from https://github.com/pyobs/pyobs-gui/blob/master/test/robotic.yaml — see
# specs/steering/testing-against-live-backend.md for the transformation.
# Requires ejabberd accounts "mastermind" and "scheduler" on domain "localhost". Run with:
#   <pyobs-venv>/bin/pyobs testing/pyobs-gui-configs/xmpp/robotic.yaml
#
# Needs a current pyobs-core with IRobotic/IRoboticScheduler support — this repo's pinned
# testing/.venv (2.0.0.dev53) predates it; use an editable install of ../pyobs-core instead
# (uv pip install --python testing/.venv -e ../pyobs-core[full]) until the pin is bumped.
class: pyobs.modules.MultiModule

location:
  longitude: 9.944722
  latitude: 51.560583
  elevation: 201

modules:
  mastermind:
    class: pyobs.modules.robotic.DummyMastermind
    # raised from the 0.2 default so the "next up" / cant_run_reason panel is visible more often
    # for visual testing -- RoboticState.next is only populated during a simulated "can't run"
    # wait, same as the real Mastermind (see specs/design/irobotic.md in pyobs-core)
    blocked_probability: 0.6
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: mastermind
      password: pyobs

  scheduler:
    class: pyobs.modules.robotic.DummyScheduler
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: scheduler
      password: pyobs
