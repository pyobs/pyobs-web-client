# XMPP-adapted from https://github.com/pyobs/pyobs-gui/blob/master/test/autofocus.yaml — see
# specs/steering/testing-against-live-backend.md for the transformation.
# Requires an ejabberd account "autofocus" on domain "localhost". Run with:
#   <pyobs-venv>/bin/pyobs testing/pyobs-gui-configs/xmpp/autofocus.yaml
class: pyobs.modules.MultiModule

location:
  longitude: 9.944722
  latitude: 51.560583
  elevation: 201

modules:
  autofocus:
    class: pyobs.modules.focus.DummyAutoFocus
    name: autofocus
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: autofocus
      password: pyobs
