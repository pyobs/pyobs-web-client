# XMPP-adapted from https://github.com/pyobs/pyobs-gui/blob/master/test/acquisition.yaml — see
# specs/steering/testing-against-live-backend.md for the transformation this
# applies (LocalComm -> XmppComm per module, gui: submodule dropped since the
# web client logs in as its own separate XMPP identity instead).
#
# Requires an ejabberd account "acquisition" on domain "localhost" — see the
# steering doc for how to register one. Run with:
#   <pyobs-venv>/bin/pyobs testing/pyobs-gui-configs/xmpp/acquisition.yaml
class: pyobs.modules.MultiModule

location:
  longitude: 9.944722
  latitude: 51.560583
  elevation: 201

modules:
  acquisition:
    class: pyobs.modules.pointing.DummyAcquisition
    name: acquisition
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: acquisition
      password: pyobs
