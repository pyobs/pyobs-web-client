# XMPP-adapted from https://github.com/pyobs/pyobs-gui/blob/master/test/video.yaml — see
# specs/steering/testing-against-live-backend.md for the transformation.
# Requires an ejabberd account "video" on domain "localhost". Run with:
#   <pyobs-venv>/bin/pyobs testing/pyobs-gui-configs/xmpp/video.yaml
class: pyobs.modules.MultiModule

vfs: &vfs
  class: pyobs.vfs.VirtualFileSystem
  roots:
    cache:
      class: pyobs.vfs.LocalFile
      root: /tmp/pyobs-test/
    webcam:
      class: pyobs.vfs.HttpFile
      download: http://localhost:37077/

modules:
  video:
    class: pyobs.modules.camera.dummyvideo.DummyVideo
    name: video
    port: 37077
    vfs: *vfs
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: video
      password: pyobs
