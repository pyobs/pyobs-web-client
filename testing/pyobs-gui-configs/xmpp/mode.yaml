# XMPP-adapted from https://github.com/pyobs/pyobs-gui/blob/master/test/mode.yaml — see
# specs/steering/testing-against-live-backend.md for the transformation.
# Requires an ejabberd account "mode" on domain "localhost". Run with:
#   <pyobs-venv>/bin/pyobs testing/pyobs-gui-configs/xmpp/mode.yaml
class: pyobs.modules.MultiModule

modules:
  mode:
    class: pyobs.modules.utils.dummymode.DummyMode
    name: mode
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: mode
      password: pyobs
