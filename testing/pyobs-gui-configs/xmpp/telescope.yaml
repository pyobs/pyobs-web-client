# XMPP-adapted from https://github.com/pyobs/pyobs-gui/blob/master/test/telescope.yaml — see
# specs/steering/testing-against-live-backend.md for the transformation.
# Requires an ejabberd account "telescope" on domain "localhost". Run with:
#   <pyobs-venv>/bin/pyobs testing/pyobs-gui-configs/xmpp/telescope.yaml
class: pyobs.modules.MultiModule

location:
  longitude: 9.944722
  latitude: 51.560583
  elevation: 201

modules:
  telescope:
    class: pyobs.modules.telescope.DummyAltAzTelescope
    name: telescope
    comm:
      class: pyobs.comm.xmpp.XmppComm
      domain: localhost
      use_tls: True
      ignore_cert_errors: True
      user: telescope
      password: pyobs
