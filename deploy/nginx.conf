server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /path/to/dist;
    index index.html;

    # SPA fallback: any unmatched path resolves to index.html so vue-router
    # can handle client-side routes (deep links, refreshes on /foo/bar).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite, safe to cache aggressively.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
