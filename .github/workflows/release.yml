name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: |
          cd dist
          zip -r "../pyobs-web-client-${{ github.ref_name }}.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          files: pyobs-web-client-${{ github.ref_name }}.zip
          generate_release_notes: true
