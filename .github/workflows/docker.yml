name: Build and Push Docker Image

on:
  # release.yml's `softprops/action-gh-release` step publishes releases using
  # the default GITHUB_TOKEN — GitHub deliberately does not cascade workflow
  # triggers from events authored by that token (anti-recursion guard), so
  # `release: published` below never actually fires from the normal
  # tag-push -> Release workflow -> publish path (confirmed: v0.6.0 had to be
  # built and pushed by hand). `workflow_run` is what makes the automated
  # path work, since it triggers off the Release workflow *run* completing,
  # not off a token-authored event. `release: published` is kept anyway for
  # the rare case of a maintainer manually publishing/re-publishing a release
  # from the GitHub UI without going through a new tag push.
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-push:
    name: Build and push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Login to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name || github.event.workflow_run.head_branch || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
